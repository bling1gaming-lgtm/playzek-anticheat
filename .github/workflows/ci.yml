name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Ubuntu + PostgreSQL 17)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: playzek_ci
          POSTGRES_PASSWORD: playzek_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playzek_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build backend/api/Playzek.Api -c Release
      - run: dotnet build tests/unit/Playzek.Tests.Unit -c Release
      - run: dotnet build tests/integration/Playzek.Tests.Integration -c Release
      - name: Migrațiile sunt la zi cu modelul
        run: dotnet ef migrations has-pending-model-changes --project backend/data/Playzek.Data --startup-project backend/data/Playzek.Data
      - name: Teste unitare
        run: dotnet test tests/unit/Playzek.Tests.Unit -c Release --no-build --logger GitHubActions
      - name: Teste de integrare (SQLite in-memory)
        run: dotnet test tests/integration/Playzek.Tests.Integration -c Release --no-build --logger GitHubActions
      - name: Teste de integrare pe PostgreSQL 17 (migrații reale)
        env:
          PLAYZEK_TEST_POSTGRES: Host=localhost;Port=5432;Username=playzek_ci;Password=playzek_ci
        run: dotnet test tests/integration/Playzek.Tests.Integration -c Release --no-build --logger GitHubActions

  windows-client:
    name: Client Windows + MSI
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Playzek.AntiCheat.slnx -c Release
      - name: Teste client (motor de protecție contra backend-ului real în memorie)
        run: dotnet test tests/integration/Playzek.Client.Tests -c Release --no-build --logger GitHubActions
      - name: Construiește PLAYZEK-ANTICHEAT-Setup.msi
        shell: pwsh
        run: ./build/build-installer.ps1 -Version 0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: PLAYZEK-ANTICHEAT-Setup
          path: artifacts/installer/PLAYZEK-ANTICHEAT-Setup.msi
          retention-days: 14
