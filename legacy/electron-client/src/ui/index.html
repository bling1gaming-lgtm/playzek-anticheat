<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Playzek Guard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600;700;800&display=swap');
  :root{
    --bg:#06070c; --panel:#0e111b; --panel2:#141828; --border:#1f2437;
    --accent:#ff5722; --accent2:#ffb86b; --text:#eef0f8; --muted:#838aa3;
    --green:#2ee6a6; --red:#ff4d6d; --gold:#ffcc4d;
  }
  *{box-sizing:border-box; user-select:none;}
  body{
    margin:0; background:
      radial-gradient(500px 300px at 100% 0%, rgba(255,87,34,.12), transparent 70%),
      var(--bg);
    color:var(--text); font-family:"Inter", sans-serif; font-size:13px;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    -webkit-app-region: drag;
  }
  button, .no-drag { -webkit-app-region: no-drag; }

  .header{
    padding:16px 20px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border);
  }
  .mark{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(145deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-weight:900;color:#160900;
    font-family:"Rajdhani",sans-serif; font-size:17px;
    box-shadow:0 0 18px rgba(255,87,34,.4);
  }
  .brand{font-weight:800;font-size:15px;font-family:"Rajdhani",sans-serif;}
  .brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-top:-1px;}

  /* ---- Shield hero ---- */
  .shield-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 20px 18px;}
  .shield{
    width:96px;height:108px;position:relative;margin-bottom:14px;
    transition:filter .3s;
  }
  .shield svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 20px rgba(46,230,166,.25));}
  .shield.flagged svg{filter:drop-shadow(0 6px 20px rgba(255,77,109,.3));}
  .shield.scanning svg{filter:drop-shadow(0 6px 20px rgba(255,184,107,.3));}

  .status-label{font-family:"Rajdhani",sans-serif;font-weight:800;font-size:19px;letter-spacing:.3px;}
  .status-label.clean{color:var(--green);}
  .status-label.flagged{color:var(--red);}
  .status-label.scanning{color:var(--accent2);}
  .status-label.idle{color:var(--muted);}
  .status-sub{color:var(--muted);font-size:11.5px;margin-top:5px;text-align:center;max-width:260px;}

  .divider{height:1px;background:var(--border);margin:4px 20px;}

  .section{margin:16px 20px;}
  .section-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between;}
  .scan-result{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:11.5px;color:var(--muted);}
  .scan-result.clean{color:var(--green);border-color:rgba(46,230,166,.25);}
  .scan-result.dirty{color:var(--red);border-color:rgba(255,77,109,.25);}

  .btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:12.5px;cursor:pointer;margin-top:9px;font-family:"Inter",sans-serif;transition:.15s;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0900;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn:disabled{opacity:.4;cursor:default;}

  .meta-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:6px 0;}
  .meta-row b{color:var(--text);font-weight:700;}

  footer{margin-top:auto;padding:12px 20px;font-size:10px;color:var(--muted);border-top:1px solid var(--border);text-align:center;letter-spacing:.2px;}
  footer b{color:var(--accent2);}
</style>
</head>
<body>

  <div class="header">
    <div class="mark">P</div>
    <div class="brand">Playzek Guard<small>client anticheat</small></div>
  </div>

  <div class="shield-wrap">
    <div class="shield idle" id="shield">
      <svg viewBox="0 0 100 112" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="currentColor" stop-opacity="0.5"/>
          </linearGradient>
        </defs>
        <path d="M50 2 L94 18 V54 C94 82 74 100 50 110 C26 100 6 82 6 54 V18 Z"
              fill="url(#shieldGrad)" stroke="currentColor" stroke-width="2" id="shield-path" style="color:#5c6380"/>
        <path id="shield-icon" d="M35 56 L46 67 L67 42" fill="none" stroke="#06070c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="status-label idle" id="status-label">INACTIV</div>
    <div class="status-sub" id="status-sub">Pornește o scanare locală sau conectează-te la un meci ranked.</div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title"><span>Scanare locală</span><span id="scan-time">—</span></div>
    <div class="scan-result" id="scan-result">Niciun rezultat încă.</div>
    <button class="btn btn-ghost" id="btn-scan">Scanează acum</button>
  </div>

  <div class="section" style="margin-top:0;">
    <div class="section-title">Meci ranked</div>
    <div class="meta-row"><span>Server</span><b id="meta-server">—</b></div>
    <div class="meta-row"><span>ID meci</span><b id="meta-match">—</b></div>
    <button class="btn btn-primary" id="btn-connect">Conectează-te la meciul curent</button>
    <button class="btn btn-ghost" id="btn-disconnect" disabled>Deconectează</button>
  </div>

  <footer>Playzek Guard v0.1 · scanare non-invazivă · <b>fără citire de memorie</b></footer>

<script>
  const shield = document.getElementById('shield');
  const shieldPath = document.getElementById('shield-path');
  const statusLabel = document.getElementById('status-label');
  const statusSub = document.getElementById('status-sub');
  const scanResultEl = document.getElementById('scan-result');
  const scanTimeEl = document.getElementById('scan-time');
  const btnConnect = document.getElementById('btn-connect');
  const btnDisconnect = document.getElementById('btn-disconnect');

  const COLORS = { idle:'#5c6380', clean:'#2ee6a6', flagged:'#ff4d6d', scanning:'#ffb86b' };

  function setShield(kind, label, sub){
    shield.className = 'shield ' + kind;
    shieldPath.style.color = COLORS[kind];
    statusLabel.className = 'status-label ' + kind;
    statusLabel.textContent = label;
    statusSub.textContent = sub || '';
  }

  document.getElementById('btn-scan').addEventListener('click', async () => {
    setShield('scanning', 'SE SCANEAZĂ...', '');
    const result = await window.playzekGuard.scanNow();
    scanTimeEl.textContent = new Date(result.scannedAt).toLocaleTimeString('ro-RO');
    if(result.clean){
      scanResultEl.textContent = `Curat — ${result.processCount} procese verificate.`;
      scanResultEl.className = 'scan-result clean';
      setShield('clean', 'SISTEM CURAT', 'Nu s-a detectat nimic suspect.');
    } else {
      scanResultEl.textContent = `${result.flags.length} semnal(e) suspect(e) găsite.`;
      scanResultEl.className = 'scan-result dirty';
      setShield('flagged', 'ATENȚIE', 'Verifică detaliile înainte să intri în meci.');
    }
  });

  btnConnect.addEventListener('click', async () => {
    setShield('scanning', 'SE CONECTEAZĂ...', '');
    document.getElementById('meta-server').textContent = 'playzek.ro';
    document.getElementById('meta-match').textContent = 'DEMO_MATCH';
    btnConnect.disabled = true;
    btnDisconnect.disabled = false;
    await window.playzekGuard.startMatch({
      serverUrl: 'wss://playzek.ro/anticheat',
      authToken: 'DEMO_TOKEN',
      matchId: 'DEMO_MATCH'
    });
  });

  btnDisconnect.addEventListener('click', async () => {
    await window.playzekGuard.stopMatch();
    btnConnect.disabled = false;
    btnDisconnect.disabled = true;
    document.getElementById('meta-server').textContent = '—';
    document.getElementById('meta-match').textContent = '—';
    setShield('idle', 'INACTIV', 'Pornește o scanare locală sau conectează-te la un meci ranked.');
  });

  window.playzekGuard.onStatus(({status, detail}) => {
    if(status === 'connected') setShield('clean', 'PROTEJAT', 'Monitorizare activă pentru acest meci.');
    else if(status === 'disconnected') setShield('idle', 'INACTIV', 'Conexiunea s-a închis.');
    else if(status === 'flagged') setShield('flagged', 'FLAG DETECTAT', 'Raportat pentru revizuire de admin.');
    else if(status === 'error') setShield('flagged', 'EROARE CONEXIUNE', detail);
  });
</script>
</body>
</html>
